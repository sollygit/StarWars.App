<app-page-layout>
    <div class="content-layout">
        <div class="content__body">
            <mat-card *ngIf="item" class="card">
                <mat-card-header>
                    <mat-card-title>Movie Edit</mat-card-title>
                </mat-card-header>
                <mat-card-content>
                    <form #movieForm="ngForm" (ngSubmit)="onUpdate()">
                        <mat-form-field>
                            <mat-label>Title</mat-label>
                            <input matInput name="title" [(ngModel)]="item.title" required />
                        </mat-form-field>
                        <mat-form-field>
                            <mat-label>Price</mat-label>
                            <input matInput type="number" name="price" [(ngModel)]="item.price" required min="0" />
                        </mat-form-field>
                        <mat-form-field>
                            <mat-label>Poster URL</mat-label>
                            <input matInput name="poster" [(ngModel)]="item.poster" required
                                pattern="https://picsum.photos/640/480\?random\=[0-9]+"
                                placeholder="https://picsum.photos/640/480?random=\=[0-9]+" />
                            <mat-hint>Use format: https://picsum.photos/640/480?random=[number]</mat-hint>
                        </mat-form-field>
                        <div class="w-100">
                            <img src="{{ item.poster }}" alt="poster" />
                        </div>
                        <div class="button-row">
                            <button mat-raised-button type="submit"
                                [disabled]="movieForm.invalid">Update</button>
                            <button mat-raised-button type="button" (click)="onCancel()"
                                class="btn btn-primary">Cancel</button>
                        </div>
                    </form>
                </mat-card-content>
            </mat-card>
            <pre *ngIf="!item">{{ message }}</pre>
        </div>
    </div>
    <mat-progress-bar *ngIf="loading" mode="indeterminate"></mat-progress-bar>
</app-page-layout>
